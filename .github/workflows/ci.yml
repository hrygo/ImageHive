name: ci

# The package targets macOS 26 (see Package.swift), so the runner image has to
# provide that SDK. `macos-latest` tracks the newest stable image — pinning a
# version label such as `macos-26` fails to schedule at all when the label does
# not exist yet (measured: both jobs failed with zero steps), so the workflow
# asserts the SDK version instead of trusting the label.
#
# While this repository was private, *no* job could start on this account, macOS or
# Linux alike (measured: a probe matrix of ubuntu-latest + macos-latest both failed
# with zero steps) — an Actions minutes/billing matter, not anything in this file.
# The repository is public now, so the standard runners are available again.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Show toolchain
        run: |
          swift --version && sw_vers && xcrun --show-sdk-version
          swift_major="$(sw_vers -productVersion | cut -d. -f1)"
          [ "$swift_major" -ge 26 ] || { echo "::error::this package needs the macOS 26 SDK or newer"; exit 1; }

      - name: Build
        run: make build

      - name: Smoke test (protocol, no model)
        run: make test-quick

      - name: Installer dry run
        run: ./install.sh --dry-run --model none --clients none

      - name: Uninstaller dry run
        run: ./uninstall.sh --dry-run

      # The shell entry points are the product for everyone who is not a Swift
      # developer; a syntax error in one of them is a broken release.
      - name: Shell syntax
        run: |
          for script in install.sh uninstall.sh cli/sensenova-u1 cli/lib/*.sh scripts/*.sh Tests/smoke.sh; do
            bash -n "$script"
          done

  release:
    # The macOS runners bill at ten times the Linux rate, and this job is the
    # expensive one (full build + installing the tarball). Run it when a release
    # is actually being cut: push a v* tag, or start it by hand.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build the installable tarball
        run: make release

      # Installs the tarball into a private HOME with --skip-build (no Xcode, no
      # Swift) and quarantined files, which is exactly the path a user takes.
      # The launchd/service steps are skipped: runners have no GUI domain.
      - name: Install from the tarball without a toolchain
        env:
          SENSENOVA_VERIFY_SKIP_SERVICE: "1"
        run: bash scripts/verify_release.sh dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: sensenova-u1-macos-arm64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
