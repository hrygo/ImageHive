name: runner-probe

# Temporary: tells apart "Actions cannot start here at all" from "macOS runners
# are not available for this account". Delete once the answer is known.
on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: What am I running on
        run: |
          uname -a
          sw_vers || true
          echo "runner=${{ matrix.os }}"
